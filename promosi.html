<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Defender Academy — Animated Promo Poster</title>
  <style>
    :root {
      --bg-deep: #050a14;
      --bg-panel: #0b1426;
      --cyan: #00f0ff;
      --green: #00ff88;
      --purple: #b87cff;
      --text-main: #f0f6ff;
      --text-muted: #9eb3d1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #03060c;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-x: hidden;
    }

    /* Toolbar Kontrol */
    .control-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 0.9rem;
      z-index: 20;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .control-bar.hidden-bar {
      opacity: 0;
      pointer-events: none;
      position: fixed;
      transform: translateY(-16px);
    }

    .ctrl-btn {
      background: rgba(11, 20, 38, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.38);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .ctrl-btn.active {
      background: rgba(0, 240, 255, 0.18);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .ctrl-btn.record {
      background: linear-gradient(135deg, #00e5ff, #00ff88);
      color: #03131d;
      border: none;
    }

    /* Bingkai Poster */
    .poster-frame {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 3 / 4;
      background: radial-gradient(circle at 50% 42%, #0d1d38 0%, #050a14 78%);
      border: 1.5px solid rgba(0, 240, 255, 0.45);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.18), 0 24px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.4rem 1.25rem;
      transition: all 0.3s ease;
    }

    .poster-frame.ratio-9-16 {
      max-width: 360px;
      aspect-ratio: 9 / 16;
      padding: 2.1rem 1.25rem;
    }

    .poster-frame.ratio-16-9 {
      max-width: 760px;
      aspect-ratio: 16 / 9;
      padding: 1.3rem 1.8rem;
    }

    #shield-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Garis Scanline */
    .scanline {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.65), transparent);
      box-shadow: 0 0 12px var(--cyan);
      z-index: 2;
      animation: scanMove 4.5s linear infinite;
      pointer-events: none;
    }

    @keyframes scanMove {
      0% { top: -5%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 105%; opacity: 0; }
    }

    /* HUD Corners */
    .hud-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--cyan);
      border-style: solid;
      z-index: 3;
      opacity: 0.8;
    }
    .tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
    .bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
    .br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    /* Konten Teks Poster */
    .poster-top, .poster-bottom {
      position: relative;
      z-index: 4;
      text-align: center;
    }

    .rank-badge {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--green);
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid rgba(0, 255, 136, 0.45);
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 0.65rem;
    }

    .main-title {
      font-size: clamp(1.45rem, 5vw, 1.95rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.12;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.65);
    }

    .sub-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--cyan);
      margin-top: 0.4rem;
    }

    .telemetry-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.65rem;
    }

    .tele-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.66rem;
      padding: 0.22rem 0.5rem;
      border-radius: 6px;
      background: rgba(6, 13, 26, 0.82);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--text-muted);
    }

    .tele-chip strong {
      color: var(--green);
    }

    .feature-box {
      background: rgba(7, 15, 30, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      padding: 0.5rem 0.65rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-main);
      margin-bottom: 0.6rem;
    }

    .url-bar {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.03em;
    }

    .poster-frame.ratio-16-9 .poster-top {
      text-align: left;
      max-width: 56%;
    }
    .poster-frame.ratio-16-9 .poster-bottom {
      text-align: left;
      max-width: 56%;
    }
    .poster-frame.ratio-16-9 .telemetry-row {
      justify-content: flex-start;
    }
  </style>
</head>
<body>
  <div id="control-bar" class="control-bar">
    <button class="ctrl-btn active" data-ratio="3-4">3:4 Poster</button>
    <button class="ctrl-btn" data-ratio="9-16">9:16 Story</button>
    <button class="ctrl-btn" data-ratio="16-9">16:9 Banner</button>
    <button id="btn-clean-record" class="ctrl-btn record">🎥 Clean Record Mode</button>
  </div>

  <div id="poster-frame" class="poster-frame">
    <canvas id="shield-canvas"></canvas>
    <div class="scanline"></div>
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>

    <div class="poster-top">
      <div class="rank-badge">CDA // SEC-OS v4.3 • INTERN TO CISO</div>
      <h1 class="main-title">CYBER DEFENDER<br />ACADEMY</h1>
      <div class="sub-title">DEFENSIVE SOC &amp; CAREER SIMULATOR</div>
    </div>

    <div class="poster-bottom">
      <div class="telemetry-row">
        <span class="tele-chip">STATUS: <strong>100% DEFENSIVE</strong></span>
        <span class="tele-chip">STANDARDS: <strong>NIST • MITRE • CIS</strong></span>
      </div>
      <div class="feature-box">
        50+ MISSIONS • MINI SIEM • THREAT INTEL • CYBER LABS
      </div>
      <div class="url-bar">andarmax.github.io/cyber-defender-academy</div>
    </div>
  </div>

  <script>
    const frame = document.getElementById('poster-frame');
    const bar = document.getElementById('control-bar');
    const canvas = document.getElementById('shield-canvas');
    const ctx = canvas.getContext('2d');

    document.querySelectorAll('.ctrl-btn[data-ratio]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.ctrl-btn[data-ratio]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        frame.classList.remove('ratio-9-16', 'ratio-16-9');
        if (btn.dataset.ratio === '9-16') frame.classList.add('ratio-9-16');
        if (btn.dataset.ratio === '16-9') frame.classList.add('ratio-16-9');
        resizeCanvas();
      });
    });

    document.getElementById('btn-clean-record').addEventListener('click', (e) => {
      e.stopPropagation();
      bar.classList.add('hidden-bar');
    });

    document.body.addEventListener('click', () => {
      if (bar.classList.contains('hidden-bar')) {
        bar.classList.remove('hidden-bar');
      }
    });

    let w = 0;
    let h = 0;
    const particles = Array.from({ length: 42 }, () => ({
      x: Math.random(),
      y: Math.random(),
      vy: 0.0008 + Math.random() * 0.0016,
      r: 1 + Math.random() * 1.8
    }));

    function resizeCanvas() {
      const rect = frame.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = rect.width * dpr;
      h = canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawShieldPath(cx, cy, radius) {
      ctx.beginPath();
      ctx.moveTo(cx, cy - radius);
      ctx.lineTo(cx + radius * 0.82, cy - radius * 0.62);
      ctx.quadraticCurveTo(cx + radius * 0.85, cy + radius * 0.25, cx, cy + radius * 1.02);
      ctx.quadraticCurveTo(cx - radius * 0.85, cy + radius * 0.25, cx - radius * 0.82, cy - radius * 0.62);
      ctx.closePath();
    }

    let t = 0;
    function render() {
      t += 0.02;
      const cw = frame.clientWidth;
      const ch = frame.clientHeight;
      ctx.clearRect(0, 0, cw, ch);

      // Subtle Grid
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
      ctx.lineWidth = 1;
      const step = 28;
      for (let x = 0; x < cw; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
        ctx.stroke();
      }
      for (let y = 0; y < ch; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
      }

      // Floating Neon Particles
      for (const p of particles) {
        p.y -= p.vy;
        if (p.y < 0) p.y = 1;
        ctx.fillStyle = 'rgba(0, 240, 255, 0.45)';
        ctx.beginPath();
        ctx.arc(p.x * cw, p.y * ch, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      const isWide = frame.classList.contains('ratio-16-9');
      const cx = isWide ? cw * 0.77 : cw * 0.5;
      const cy = isWide ? ch * 0.5 : ch * 0.48;
      const baseR = Math.min(cw, ch) * (isWide ? 0.28 : 0.22);

      // Rotating Radar Ring
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t * 0.45);
      ctx.strokeStyle = 'rgba(0, 255, 136, 0.26)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.arc(0, 0, baseR * 1.25, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Outer & Inner Pulsing Cyber Shield
      const pulse = 1 + Math.sin(t * 2) * 0.03;
      drawShieldPath(cx, cy, baseR * pulse);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
      ctx.fill();
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.2;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 16;
      ctx.stroke();
      ctx.shadowBlur = 0;

      drawShieldPath(cx, cy, baseR * 0.74);
      ctx.strokeStyle = 'rgba(0, 255, 136, 0.75)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      // Core Lock / Pulse Node
      ctx.fillStyle = '#00ff88';
      ctx.beginPath();
      ctx.arc(cx, cy - baseR * 0.05, 5 + Math.sin(t * 3) * 1.5, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
